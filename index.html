<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>只在這裡吃得到</title>
<meta name="description" content="輸入一個國家或民族，看五道只有在當地才吃得到的代表食物：可旋轉拆解的 3D 模型、材料、做法與地位。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root {
  --bg: #eceee7;
  --surface: #f8f9f4;
  --surface-2: #e2e5dc;
  --ink: #1b2420;
  --muted: #5a6760;
  --line: #d2d7cd;
  --accent: #2346a3;
  --accent-soft: #dfe5f6;
  --accent-ink: #ffffff;
  --saffron: #b9790c;
  --saffron-soft: #f6e7c6;
  --stage: #d9d8cf;
  --danger: #a3321f;
  --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 8px 24px rgba(20, 30, 25, .07);
  --f-display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513;
    --surface: #181e1b;
    --surface-2: #212925;
    --ink: #e5eae4;
    --muted: #9aa69f;
    --line: #2b342f;
    --accent: #93a9f0;
    --accent-soft: #232c45;
    --accent-ink: #0f1422;
    --saffron: #e5ad48;
    --saffron-soft: #3a2f18;
    --stage: #1c2320;
    --danger: #ec8a72;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513;
  --surface: #181e1b;
  --surface-2: #212925;
  --ink: #e5eae4;
  --muted: #9aa69f;
  --line: #2b342f;
  --accent: #93a9f0;
  --accent-soft: #232c45;
  --accent-ink: #0f1422;
  --saffron: #e5ad48;
  --saffron-soft: #3a2f18;
  --stage: #1c2320;
  --danger: #ec8a72;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1320px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- 頂部 ---------- */
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 460px);
  gap: 20px 40px;
  align-items: end;
  padding-block: 28px 18px;
}
.brand h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(34px, 5vw, 56px);
  line-height: 1.05;
  letter-spacing: .02em;
  margin: 0;
  text-wrap: balance;
}
.brand h1 .dot { color: var(--accent); }
.brand p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.search { display: flex; flex-direction: column; gap: 8px; }
.search label { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.search-row { display: flex; gap: 8px; }
.search input {
  flex: 1; min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 16px;
}
.search input::placeholder { color: var(--muted); opacity: .8; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 9px 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }

.atlas {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding-block: 4px 18px;
  border-bottom: 1px solid var(--line);
}
.chip {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 3px 12px;
  font-size: 13.5px;
  cursor: pointer;
  color: var(--ink);
}
.chip:hover { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.gen { border-style: dashed; }

/* ---------- 國家標頭 ---------- */
.country {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 6px 28px;
  align-items: baseline;
  padding-block: 26px 16px;
}
.country h2 {
  font-family: var(--f-display);
  font-size: clamp(30px, 4vw, 44px);
  margin: 0; line-height: 1.1; font-weight: 700;
}
.country .endonym { display: block; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
.country p { margin: 0; max-width: 72ch; color: var(--ink); }
.badge { display: inline-block; font-size: 11.5px; letter-spacing: .08em; padding: 1px 8px; border-radius: 4px; background: var(--saffron-soft); color: var(--saffron); margin-left: 8px; vertical-align: middle; font-family: var(--f-body); font-weight: 500; }

/* ---------- 五道菜選單 ---------- */
.menu {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 18px;
}
.menu button {
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 10px 12px 11px;
  cursor: pointer;
  display: grid; gap: 1px;
  min-width: 0;
}
.menu button:hover { border-color: var(--accent); }
.menu button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.menu .k { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.menu .n { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.menu .l { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 主體 ---------- */
.main {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.stage-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.stage {
  position: relative;
  aspect-ratio: 1 / 0.92;
  max-width: 100%;
  border-radius: 16px;
  overflow: hidden;
  background: var(--stage);
  box-shadow: var(--shadow);
  touch-action: none;
}
.stage canvas { display: block; }
.stage .tip {
  position: absolute; pointer-events: none;
  background: var(--ink); color: var(--bg);
  padding: 4px 10px; border-radius: 6px; font-size: 13px;
  transform: translate(-50%, calc(-100% - 12px));
  white-space: nowrap;
}
.stage .overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center; text-align: center;
  padding: 24px; color: var(--muted);
  background: color-mix(in srgb, var(--stage) 80%, transparent);
}
.stage .hint {
  position: absolute; left: 12px; bottom: 10px;
  font-size: 12px; color: var(--muted);
  background: color-mix(in srgb, var(--stage) 75%, transparent);
  padding: 2px 8px; border-radius: 6px;
}
.controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.controls .btn { font-size: 13.5px; padding: 6px 12px; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.parts .chip { font-size: 12.5px; padding: 2px 10px; }
.parts .chip.on { background: var(--saffron-soft); border-color: var(--saffron); color: var(--ink); }
.parts-title { font-size: 12px; letter-spacing: .12em; color: var(--muted); margin-top: 14px; }

.info { min-width: 0; }
.dish-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.dish-head .region { font-size: 12.5px; letter-spacing: .1em; color: var(--muted); }
.dish-head h3 {
  font-family: var(--f-display);
  font-size: clamp(32px, 3.6vw, 46px);
  line-height: 1.1; margin: 4px 0 2px; font-weight: 700;
  text-wrap: balance;
}
.dish-head .local { font-family: var(--f-mono); font-size: 13.5px; color: var(--accent); }
.dish-head .tagline { font-size: 17px; margin: 10px 0 0; }
.photo { margin: 16px 0 4px; }
.photo img {
  display: block; width: 100%; max-width: 100%; height: auto;
  aspect-ratio: 4 / 3; object-fit: cover;
  border-radius: 12px; background: var(--surface-2);
}
.photo figcaption { margin-top: 6px; font-size: 12px; color: var(--muted); }
.photo figcaption a { color: var(--muted); }
.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  margin-block: 16px 6px;
}
.facts div { background: var(--surface); padding: 8px 12px; }
.facts dt { font-size: 11.5px; letter-spacing: .1em; color: var(--muted); }
.facts dd { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.sec { padding-block: 18px 4px; }
.sec h4 {
  margin: 0 0 8px;
  font-size: 13px; letter-spacing: .16em; color: var(--muted); font-weight: 500;
  display: flex; align-items: center; gap: 10px;
}
.sec h4::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec p { margin: 0 0 8px; max-width: 66ch; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.ing li {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 16px; padding: 7px 8px; border-radius: 8px;
  border-bottom: 1px dashed var(--line);
  cursor: default;
}
.ing li:hover, .ing li.on { background: var(--saffron-soft); }
.ing .nm { font-weight: 500; }
.ing .am { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.ing .nt { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.steps li::before {
  content: counter(s);
  font-family: var(--f-mono); font-size: 12px;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--accent); color: var(--accent);
  display: grid; place-items: center; margin-top: 1px;
}
.why {
  background: var(--accent-soft);
  border-radius: 12px; padding: 14px 16px; margin-top: 8px;
}
.why strong { display: block; font-size: 12.5px; letter-spacing: .12em; color: var(--accent); margin-bottom: 4px; font-weight: 500; }
.why p { margin: 0; }

/* ---------- 生成面板 ---------- */
.gen-panel {
  border: 1px dashed var(--line); border-radius: 16px;
  padding: 28px; margin-top: 24px; background: var(--surface);
  display: grid; gap: 12px; max-width: 760px;
}
.gen-panel h2 { font-family: var(--f-display); margin: 0; font-size: 28px; }
.gen-panel p { margin: 0; color: var(--muted); }
.gen-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.progress { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.err { color: var(--danger); }
.note { font-size: 12.5px; color: var(--muted); }
footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

@media (max-width: 980px) {
  .top { grid-template-columns: 1fr; }
  .main { grid-template-columns: 1fr; }
  .stage-col { position: static; }
  .menu { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .country { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .menu { grid-template-columns: 1fr 1fr; }
  .stage { aspect-ratio: 1 / 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>只在這裡<br>吃得到<span class="dot">。</span></h1>
      <p>輸入一個國家或民族，端上五道離開當地就很難吃到的代表食物。每道菜都能 360° 旋轉、拆開看材料，附上做法和它在當地的地位。</p>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <label for="q">國家或民族</label>
      <div class="search-row">
        <input id="q" name="q" list="qList" placeholder="例如：台灣、日本、秘魯、喬治亞…" enterkeyhint="search">
        <button class="btn primary" type="submit">上菜</button>
      </div>
      <datalist id="qList"></datalist>
    </form>
  </header>
  <nav class="atlas" id="atlas" aria-label="已收錄"></nav>

  <section id="countryView">
    <div class="country">
      <div>
        <h2 id="cName"></h2>
        <span class="endonym" id="cEndonym"></span>
      </div>
      <p id="cIntro"></p>
    </div>
    <div class="menu" id="menu" role="tablist" aria-label="五道代表食物"></div>
    <div class="main">
      <div class="stage-col">
        <div class="stage" id="stage">
          <div class="tip" id="tip" hidden></div>
          <div class="overlay" id="stageMsg" hidden></div>
          <span class="hint" id="hint">拖曳旋轉 · 滾輪縮放 · 點食材看名稱</span>
        </div>
        <div class="controls">
          <button class="btn" id="bRotate" type="button" aria-pressed="true">自動旋轉</button>
          <button class="btn" id="bExplode" type="button" aria-pressed="false">拆解食材</button>
          <button class="btn" id="bReset" type="button">重設視角</button>
        </div>
        <div class="parts-title">3D 模型裡的食材</div>
        <div class="parts" id="parts"></div>
      </div>
      <article class="info" id="info"></article>
    </div>
  </section>

  <section id="genView" hidden></section>

  <footer>
    材料份量以家庭或小攤常見作法為準，各地、各家做法不同。3D 模型是示意重建；實拍照片來自 Wikimedia Commons，作者與授權標示在每張照片下方。
    <span id="genNote"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="engine.js"></script>
<script>window.FOOD_ATLAS = [];</script>
<script src="data/taiwan.js"></script>
<script src="data/korea.js"></script>
<script src="data/vietnam.js"></script>
<script src="data/japan.js"></script>
<script src="data/thailand.js"></script>
<script src="data/india.js"></script>
<script src="data/turkey.js"></script>
<script src="data/italy.js"></script>
<script src="data/spain.js"></script>
<script src="data/photos.js"></script>
<script src="app.js"></script>

</body>
</html>
